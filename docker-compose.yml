name: headroom
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:code
    container_name: headroom-proxy
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_PORT=8787
      # Modo token (suscripciones OAuth): comprime turnos antiguos para extender sesiones
      - HEADROOM_MODE=token
      # Perfil coding: protege lecturas de archivos activos, dedupe, code-aware y accuracy_guard=strict
      - HEADROOM_SAVINGS_PROFILE=coding
      # Reduce verborrea en tokens de salida preservando el prefix cache
      - HEADROOM_OUTPUT_SHAPER=1
      - HEADROOM_WORKSPACE_DIR=/data
      - HEADROOM_TELEMETRY=off
      # Obligatorio: Traefik entra desde la red edge-headroom (no loopback)
      - HEADROOM_PROXY_TOKEN=${HEADROOM_PROXY_TOKEN:?define HEADROOM_PROXY_TOKEN en .env}
    volumes:
      - headroom_data:/data
      - headroom_config:/root/.headroom
    # Sin "ports:": nadie llega al contenedor salvo Traefik, por la red del edge
    networks:
      default: {}              # salida a internet (api.anthropic.com); la red edge es interna
      edge:
        aliases: [headroom-web] # alias para Traefik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 2g
    pids_limit: 256

  dashboard:
    image: nginx:1.27-alpine
    container_name: headroom-dashboard
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=16m
      - /run:size=1m
      - /tmp:size=4m
    environment:
      - HEADROOM_PROXY_TOKEN=${HEADROOM_PROXY_TOKEN:?define HEADROOM_PROXY_TOKEN en .env}
      - NGINX_ENVSUBST_FILTER=^HEADROOM_PROXY_TOKEN$
    volumes:
      - ./dashboard-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    # Solo loopback del VPS: acceso únicamente por túnel SSH (ssh -L 8787:127.0.0.1:8787 ...)
    ports:
      - "127.0.0.1:8787:8080"
    networks:
      default: {}
    depends_on:
      - headroom
    mem_limit: 64m
    pids_limit: 64
networks:
  edge:
    external: true
    name: edge-headroom
volumes:
  headroom_data:
  headroom_config:
